<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ subject }}</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      background-color: #f5f5f5;
    }
    .email-container {
      max-width: 600px;
      margin: 0 auto;
      background-color: #ffffff;
    }
    .email-header {
      background-color: #1a1a1a;
      padding: 24px 20px;
      text-align: center;
    }
    .email-header .brand {
      color: #ffffff;
      font-size: 22px;
      font-weight: 700;
      letter-spacing: 1.5px;
    }
    .email-hero {
      width: 100%;
      display: block;
    }
    .email-hero img {
      width: 100%;
      height: auto;
      display: block;
    }
    .email-body {
      padding: 32px 28px;
    }
    .email-subject {
      font-size: 20px;
      font-weight: 600;
      color: #1a1a1a;
      margin-bottom: 18px;
      line-height: 1.4;
    }
    .email-text {
      font-size: 15px;
      color: #444444;
      line-height: 1.8;
      margin-bottom: 28px;
    }
    .cta-wrapper {
      text-align: center;
      margin: 24px 0;
    }
    .cta-button {
      display: inline-block;
      background-color: #ff6b35;
      color: #ffffff !important;
      text-decoration: none;
      padding: 16px 48px;
      border-radius: 8px;
      font-size: 16px;
      font-weight: 700;
      letter-spacing: 0.5px;
    }
    .email-footer {
      background-color: #f9f9f9;
      padding: 24px 28px;
      text-align: center;
      border-top: 1px solid #eeeeee;
    }
    .email-footer p {
      font-size: 12px;
      color: #999999;
      line-height: 1.8;
    }
    .email-footer a {
      color: #999999;
      text-decoration: none;
    }
    @media (max-width: 480px) {
      .email-container { width: 100% !important; }
      .email-body { padding: 20px 16px; }
      .cta-button {
        display: block;
        padding: 16px;
        text-align: center;
      }
    }
  </style>
</head>
<body>
  <div class="email-container">
    <!-- Header -->
    <div class="email-header">
      <div class="brand">{{ brand_name }}</div>
    </div>

    <!-- Hero Image -->
    <div class="email-hero">
      <img src="{{ image_url }}" alt="{{ discount }} - {{ brand_name }}" />
    </div>

    <!-- Body -->
    <div class="email-body">
      <h2 class="email-subject">{{ subject }}</h2>
      <div class="email-text">{{ body }}</div>

      <!-- CTA Button -->
      <div class="cta-wrapper">
        <a href="{{ cart_url }}" class="cta-button">{{ cta_text }}</a>
      </div>
    </div>

    <!-- Footer -->
    <div class="email-footer">
      <p>
        © 2025 {{ brand_name }}. All rights reserved.<br>
        This email was sent because you left items in your cart.<br>
        <a href="{{ cart_url }}">Unsubscribe</a> · <a href="{{ cart_url }}">View in browser</a>
      </p>
    </div>
  </div>
</body>
</html>
